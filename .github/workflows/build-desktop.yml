name: Build desktop app

# The desktop app is the same server the browser runs, wrapped in Electron. The
# build is two steps and neither is exotic: Vite for the UI, esbuild for the server,
# then electron-builder packs the result.
#
# The output is an AppImage and a .deb. An AppImage is one file a user can run
# without installing anything, which matches the project's "no nanny" stance: it
# does not need root, and it does not touch the host's package database.

on:
  workflow_dispatch:
  push:
    branches: [main, 015stray91]
    paths:
      - "src/**"
      - "desktop/**"
      - "*.ts"
      - "*.json"
      - "package.json"
      - "vite.config.ts"
      - "index.html"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: AppImage and deb
    # Self-hosted, on the project's own build VM. The steps below are unchanged
    # from the GitHub-hosted version; only where they run has moved. The runner
    # is registered as a systemd service, so it survives a disconnect.
    runs-on: [self-hosted, anyrealm-vm]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Bun is installed on the VM by scripts/vm-bootstrap.sh rather than fetched
      # per run: a setup step here would download the same binary on every build
      # and the VM already has it pinned.
      - name: Show toolchain
        run: |
          bun --version
          node --version 2>/dev/null || true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Build UI and server
        run: bun run build

      - name: Check the bundled server answers
        run: |
          NODE_ENV=production PORT=3399 ANYREALM_DATA_DIR="$PWD" node dist/server.cjs &
          SERVER=$!
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3399/api/fetch/watches > /tmp/watches.json 2>/dev/null; then break; fi
            sleep 0.5
          done
          cat /tmp/watches.json
          kill $SERVER || true
          # A server that starts but serves nothing is the failure this catches: it
          # would otherwise only show up as a blank window in the packaged app.
          grep -q '"intervalMs"' /tmp/watches.json

      - name: Package
        env:
          # electron-builder downloads its own Electron and appimagetool; no signing
          # is configured, so it produces an unsigned AppImage, which is expected.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bunx electron-builder --linux AppImage deb --publish never

      - name: List what was produced
        run: ls -lh release/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: anyrealm-builder-desktop
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30
